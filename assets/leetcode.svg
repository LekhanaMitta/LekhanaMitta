  <text x="600" y="120" class="label">Rank</text>
  <text x="600" y="152" class="value">411651</text>

  <text x="520" y="120" class="label">Difficulty Mix</text>

  <circle cx="610" cy="155" r="42" class="ring-bg"/>

  <!-- Easy -->
  <circle cx="610" cy="155" r="42"
          class="seg"
          stroke="#00b8a3" stroke-width="18"
          fill="none"
          stroke-linecap="round"
          stroke-dasharray="111.15296872930305 263.89378290154264"
          stroke-dashoffset="65.97344572538566">
    <title>Easy: 147 (42.1%) • Acceptance rate: 76%</title>
  </circle>

  <!-- Medium -->
  <circle cx="610" cy="155" r="42"
          class="seg"
          stroke="#ffc01e" stroke-width="18"
          fill="none"
          stroke-linecap="round"
          stroke-dasharray="136.86181863948198 263.89378290154264"
          stroke-dashoffset="-45.179523003917396">

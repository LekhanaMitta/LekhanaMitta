    <title>Hard: 21 (6.0%) • Acceptance rate: 78%</title>
  </circle>

  <circle cx="610" cy="155" r="33.0" class="ring-cutout"/>

  <text x="610" y="153" text-anchor="middle" class="value" style="font-size:18px;">349</text>
  <text x="610" y="173" text-anchor="middle" class="muted">Solved</text>

  <text x="520" y="206" class="muted">Overall acceptance rate: 74%</text>
</svg>
